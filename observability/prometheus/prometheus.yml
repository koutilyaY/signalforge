global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    stack: signalforge-local

scrape_configs:
  - job_name: signalforge-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8099"]
        labels:
          application: signalforge
          component: api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
